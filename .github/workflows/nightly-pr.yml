name: Nightly update PR

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make changes
        run: |
          date -u +"Last updated: %Y-%m-%d" > last-updated.txt

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          branch: nightly-update
          commit-message: "Nightly update"
          title: "Nightly update"
          body: "Automated nightly changes."
