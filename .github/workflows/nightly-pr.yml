name: Nightly projects update

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch GitHub repos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_projects.py

      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          branch: nightly-projects-update
          add-paths: projects.json
          commit-message: "Update projects from GitHub"
          title: "Update projects from GitHub"
          body: "Automated nightly refresh of projects.json from my GitHub repos."
